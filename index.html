<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Caderno Livre — uma plataforma gratuita de estudos para o ENEM, sem cadastro." />
  <meta name="theme-color" content="#0f172a" />
  <title>Caderno Livre — ENEM</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#/" aria-label="Caderno Livre">
        <span class="brand-symbol">C</span>
        <span class="brand-copy">
          <strong>Caderno Livre</strong>
          <small>ENEM</small>
        </span>
      </a>

      <nav class="main-nav" aria-label="Navegação principal">
        <button data-route="home">Início</button>
        <button data-route="subjects">Matérias</button>
        <button data-route="favorites">Favoritos</button>
      </nav>

      <div class="header-actions">
        <label class="global-search">
          <span>⌕</span>
          <input id="searchInput" type="search" placeholder="Buscar conteúdo" autocomplete="off" />
        </label>
        <button id="menuBtn" class="menu-btn" aria-label="Abrir menu">☰</button>
      </div>
    </div>
  </header>

  <div id="mobileNav" class="mobile-nav" aria-hidden="true">
    <button data-route="home">Início</button>
    <button data-route="subjects">Matérias</button>
    <button data-route="favorites">Favoritos</button>
    <button id="resetBtnMobile">Zerar progresso</button>
  </div>

  <main id="view" class="page" tabindex="-1"></main>

  <footer class="site-footer">
    <div>
      <strong>Caderno Livre</strong>
      <span>Estude para o ENEM sem cadastro. Seu progresso fica salvo apenas neste navegador.</span>
    </div>
    <button id="resetBtn" class="footer-action">Zerar progresso</button>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data/matematica.js"></script>
  <script src="data/portugues.js"></script>
  <script src="data/artes.js"></script>
  <script src="data/educacao-fisica.js"></script>
  <script src="data/historia.js"></script>
  <script src="data/geografia.js"></script>
  <script src="data/filosofia.js"></script>
  <script src="data/sociologia.js"></script>
  <script src="data/biologia.js"></script>
  <script src="data/fisica.js"></script>
  <script src="data/quimica.js"></script>
  <script>window.CADERNO_DATA={subjects:window.CADERNO_SUBJECTS||[]};</script>
  <script src="app.js"></script>
</body>
</html>
